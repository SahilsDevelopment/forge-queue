services:
  postgres_db:
    image: postgres:17
    container_name: forge-queue-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-forge-queue}
      POSTGRES_USER: ${DB_USER:-forge-queue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-s3cr3t@123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-forge-queue} -d ${DB_NAME:-forge-queue}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: